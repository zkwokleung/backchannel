name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --no-daemon

      # The release variant is the one that runs R8, resource shrinking and the native-payload
      # packaging rules — none of which the debug build exercises. It has broken this app before
      # (missing Jackson keep rules) and was only caught by hand. No signing config is present in
      # CI, so this produces unsigned APKs; it is a build check, not a distributable.
      #
      # Caveat worth knowing: this catches shrinker *build* failures, not runtime ones. A missing
      # keep rule that only blows up on launch still needs a device, so keep smoke-testing a
      # signed release before publishing a tag.
      - name: Assemble release APKs (R8 check)
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
